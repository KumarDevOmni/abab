<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durga Puja – Guest Welcome Screens</title>
<style>
body{margin:0;min-height:100vh;background:#2a0a0e;color:#f6ecd6;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
h1{font-weight:400;color:#e0b04a;margin:0;font-size:clamp(26px,6vw,44px)}
p{opacity:.8;max-width:420px;margin:0}
#list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
a{display:block;padding:16px 20px;border:2px solid #e0b04a;border-radius:12px;color:#f6ecd6;text-decoration:none;font-size:20px}
a:hover{background:#3d1219}
</style></head><body>
<h1>Durga Puja Welcome Screens</h1>
<p>Pick a guest. On the LED screen's computer, press F for fullscreen.</p>
<div id="list"></div>
<script src="guests.js"></script>
<script>
var l=document.getElementById('list');
(window.GUESTS||[]).forEach(function(g){var a=document.createElement('a');a.href='guest.html?id='+encodeURIComponent(g.id);a.textContent=g.name;l.appendChild(a)});
</script></body></html>
